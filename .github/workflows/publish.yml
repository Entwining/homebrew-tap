name: Publish bottles

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Reviewed pull request head SHA
        required: true
      run_id:
        description: Source pull_request build run ID (optional)
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]
  schedule:
    - cron: "8,38 * * * *"

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  PULL_REQUEST: ${{ inputs.pull_request || github.event.workflow_run.pull_requests[0].number }}
  EXPECTED_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
  TRIGGER_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
  SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
  SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'bump-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.source.outputs.state }}
      pull_request: ${{ steps.source.outputs.pull_request }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Identify the current pull request
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-publish.sh "$RUNNER_TEMP/source" --identify

  publish:
    needs: resolve
    if: needs.resolve.outputs.state == 'active'
    concurrency:
      group: publish-${{ needs.resolve.outputs.pull_request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: Homebrew/actions/setup-homebrew@2026.10.12.1
        id: homebrew

      - name: Resolve the source again before publishing
        id: source
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout --detach origin/main
          brew install-bundler-gems --add-groups=ast
          mkdir -p "$RUNNER_TEMP/publish-tools"
          cp .github/scripts/{bottle_receipt.rb,resolve-publish.sh} "$RUNNER_TEMP/publish-tools/"
          bash "$RUNNER_TEMP/publish-tools/resolve-publish.sh" "$RUNNER_TEMP/source"

      - uses: actions/download-artifact@v8.0.2
        if: steps.source.outputs.state == 'prepare'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          path: ${{ runner.temp }}/bottles
          digest-mismatch: error

      - name: Recompute the bottle plan without loading PR Ruby
        if: steps.source.outputs.state == 'prepare'
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: brew ruby "$RUNNER_TEMP/publish-tools/bottle_receipt.rb" plan "$RUNNER_TEMP/source/selection.json" "$RUNNER_TEMP/bottles" "$RUNNER_TEMP/plan"

      - name: Persist the build selection before Release writes
        if: steps.source.outputs.state == 'prepare'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for record in "$RUNNER_TEMP/plan/receipts/"*.json; do
            key=$(basename "$record" .json)
            ref="tags/publish/$key"
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/$ref" \
              --jq ".[] | select(.ref == \"refs/$ref\") | .object.sha")
            if [[ -n "$existing" ]]; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq .message | jq -S . > "$RUNNER_TEMP/existing-receipt.json"
              jq -S . "$record" > "$RUNNER_TEMP/expected-receipt.json"
              cmp "$RUNNER_TEMP/existing-receipt.json" "$RUNNER_TEMP/expected-receipt.json"
            else
              jq -n --arg tag "publish/$key" --rawfile message "$record" \
                --arg object "$(jq -r .tested_tree "$record")" \
                --arg date "$(jq -r .run.created_at "$RUNNER_TEMP/source/selection.json")" '
                {tag: $tag, message: $message, object: $object, type: "commit",
                 tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}
              ' > "$RUNNER_TEMP/tag.json"
              tag_sha=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" --jq .sha)
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/$ref" -f "sha=$tag_sha" --silent
            fi
          done

      - name: Upload missing assets and verify the public downloads
        if: steps.source.outputs.state == 'prepare'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/releases" "$RUNNER_TEMP/existing" "$RUNNER_TEMP/public"
          jq -c '.[]' "$RUNNER_TEMP/plan/plan.json" | while IFS= read -r record; do
            tag=$(jq -r '.formula + "-" + .pkg_version' <<< "$record")
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"; then
              :
            elif [[ $(jq -r .status "$RUNNER_TEMP/release.json") == 404 ]]; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$(jq -r .head_sha <<< "$record")" --title "$tag" --notes ''
            else
              exit 1
            fi
            jq -c '.bottles[]' <<< "$record" | while IFS= read -r bottle; do
              filename=$(jq -r .filename <<< "$bottle")
              local_filename=$(jq -r .local_filename <<< "$bottle")
              checksum=$(jq -r .sha256 <<< "$bottle")
              cp "$RUNNER_TEMP/bottles/$local_filename" "$RUNNER_TEMP/releases/$filename"
              count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq "[.assets[] | select(.name == \"$filename\")] | length")
              if [[ "$count" == 1 ]]; then
                gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir "$RUNNER_TEMP/existing"
                printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/existing/$filename" | sha256sum --check
              elif [[ "$count" == 0 ]]; then
                gh release upload "$tag" "$RUNNER_TEMP/releases/$filename" --repo "$GITHUB_REPOSITORY"
              else
                echo '::error::Ambiguous release asset.'
                exit 1
              fi
              curl --fail --location --max-time 120 \
                "$(jq -r .root_url <<< "$record")/$filename" --output "$RUNNER_TEMP/public/$filename"
              printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/public/$filename" | sha256sum --check
            done
          done

      - name: Attest the published bottles
        if: steps.source.outputs.state == 'prepare'
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/releases/*.tar.gz

      - name: Create the tap app's token
        if: contains(fromJSON('["ready","prepare","sync"]'), steps.source.outputs.state)
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.TAP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Append bottle metadata to the PR branch
        if: steps.source.outputs.state == 'prepare'
        id: commit
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          selection="$RUNNER_TEMP/source/selection.json"
          repository=$(jq -r .head_repository "$selection")
          if [[ "$repository" != "$GITHUB_REPOSITORY" ]]; then
            branch="publish/pr-$(jq -r .pull_request "$selection")-$(jq -r .head_sha "$selection")"
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$branch" \
              --jq ".[] | select(.ref == \"refs/heads/$branch\") | .object.sha")
            if [[ -n "$existing" ]]; then
              git fetch --no-tags origin "$existing" 'refs/tags/publish/*:refs/tags/publish/*'
              jq --arg sha "$existing" '.head_sha = $sha' "$selection" > "$RUNNER_TEMP/helper-selection.json"
              brew ruby "$RUNNER_TEMP/publish-tools/bottle_receipt.rb" check "$RUNNER_TEMP/helper-selection.json"
              git diff --name-only "$(jq -r .head_sha "$selection")" "$existing" | sort > "$RUNNER_TEMP/actual-paths.txt"
              jq -r '.paths[]' "$selection" | sort > "$RUNNER_TEMP/expected-paths.txt"
              cmp "$RUNNER_TEMP/actual-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
              echo "sha=$existing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" \
              -f "sha=$(jq -r .head_sha "$selection")" --silent
            jq --arg branch "$branch" '.branch = $branch' "$selection" > "$RUNNER_TEMP/helper-selection.json"
            selection="$RUNNER_TEMP/helper-selection.json"
          fi
          brew ruby "$RUNNER_TEMP/publish-tools/bottle_receipt.rb" commit "$selection" "$RUNNER_TEMP/plan/plan.json" > "$RUNNER_TEMP/commit.json"
          sha=$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Request GitHub squash merge or show the fork patch
        if: contains(fromJSON('["ready","prepare","sync"]'), steps.source.outputs.state)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOTTLE_SHA: ${{ steps.commit.outputs.sha || steps.source.outputs.head_sha }}
          TAP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          selection="$RUNNER_TEMP/source/selection.json"
          pull_request=$(jq -r .pull_request "$selection")
          update_branch() {
            local method=MERGE
            if [[ $(jq -r .head.ref "$RUNNER_TEMP/source/pr.json") == bump-* && \
                  $(jq -r .author "$RUNNER_TEMP/source/pr.json") == "$TAP_BOT_LOGIN" ]]; then
              method=REBASE
            fi
            # shellcheck disable=SC2016
            gh api graphql -f query='
              mutation($pr: ID!, $head: GitObjectID!, $method: PullRequestBranchUpdateMethod!) {
                updatePullRequestBranch(input: {pullRequestId: $pr, expectedHeadOid: $head, updateMethod: $method}) {
                  clientMutationId
                }
              }' -f "pr=$(jq -r .node_id "$RUNNER_TEMP/source/pr.json")" \
              -f "head=$BOTTLE_SHA" -f "method=$method" --silent
          }
          if [[ $(jq -r .head_repository "$selection") == "$GITHUB_REPOSITORY" && \
                $(jq -r .mergeable_state "$RUNNER_TEMP/source/pr.json") == behind ]]; then
            update_branch
            exit 0
          fi
          if [[ $(jq -r .head_repository "$selection") != "$GITHUB_REPOSITORY" && $(jq -r .state "$RUNNER_TEMP/source/status.json") != ready ]]; then
            branch="publish/pr-$pull_request-$(jq -r .head_sha "$selection")"
            {
              printf 'The original PR remains open. Apply the bottle commit, update with main, then dispatch Publish bottles for the new head.\n\n'
              printf '```sh\ngh pr checkout %s --repo %s\n' "$pull_request" "$GITHUB_REPOSITORY"
              printf 'git fetch https://github.com/%s %s\ngit merge --ff-only FETCH_HEAD\n' "$GITHUB_REPOSITORY" "$branch"
              printf 'git fetch https://github.com/%s main\ngit merge --no-edit FETCH_HEAD\ngit push\n```\n' "$GITHUB_REPOSITORY"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$pull_request" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$BOTTLE_SHA"
          gh pr view "$pull_request" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid,mergeStateStatus > "$RUNNER_TEMP/merge.json"
          if [[ $(jq -r .head_repository "$selection") == "$GITHUB_REPOSITORY" ]] && \
             jq -e --arg sha "$BOTTLE_SHA" '.state == "OPEN" and .headRefOid == $sha and .mergeStateStatus == "BEHIND"' "$RUNNER_TEMP/merge.json" > /dev/null; then
            update_branch
          fi

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Resume open release pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,headRefName,headRefOid,isCrossRepository,isDraft \
            --jq '.[] | select(.isCrossRepository == false and .isDraft == false and (.headRefName | startswith("bump-"))) | [.number, .headRefOid] | @tsv' \
            > "$RUNNER_TEMP/pull-requests.tsv"
          while IFS=$'\t' read -r number sha; do
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" -f "pull_request=$number" -f "head_sha=$sha"
          done < "$RUNNER_TEMP/pull-requests.tsv"
