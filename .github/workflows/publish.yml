name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    # Bump branches come from the update workflows; only collaborators can push a branch to this repository,
    # so a fork's pull request still needs a manual dispatch after review.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'bump-'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      # pr-pull skips the download when a pull request changes no formula, so there is nothing to attest.
      - name: Check for bottles
        id: bottles
        env:
          BOTTLE_PATH: ${{ steps.pull_bottles.outputs.bottle_path }}
        run: |
          if compgen -G "$BOTTLE_PATH/*.tar.gz" > /dev/null
          then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build provenance
        if: steps.bottles.outputs.found == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          branch: main
