name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  # Bottles a formula whose current version has none; test-bot otherwise bottles only formulae a pull request changes.
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to bottle, such as entwining/tap/sessidx
        required: true

permissions: {}

# A newer push to a pull request supersedes its running build; publish.yml skips the cancelled run.
concurrency:
  group: test-bot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: macos-26
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Test bottle receipt handling
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          brew install-bundler-gems --add-groups=ast
          python3 -m unittest discover -s .github/scripts -p '*_test.py'

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - run: brew test-bot --only-formulae "$FORMULA"
        if: github.event_name == 'workflow_dispatch'
        env:
          FORMULA: ${{ inputs.formula }}

      - name: Merge and audit candidate bottle metadata
        if: github.event_name != 'push'
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          bottles=( ./*.bottle.json )
          if (( ${#bottles[@]} == 0 )); then exit 0; fi
          brew bottle --merge --write --no-commit --no-all-checks "${bottles[@]}"
          while IFS= read -r formula; do
            brew audit --formula --skip-style "$TAP/$formula"
          done < <(jq -r '.[].formula.name' "${bottles[@]}" | sort -u)

      - name: Upload bottles as artifact
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bottles_macos-26-${{ github.run_attempt }}
          path: '*.bottle.*'
