name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  # Bottles a formula whose current version has none; test-bot otherwise bottles only formulae a pull request changes.
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to bottle, such as entwining/tap/sessidx
        required: true

permissions: {}

# A newer push to a pull request supersedes its running build; publish.yml skips the cancelled run.
concurrency:
  group: test-bot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  tap-syntax:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Test bottle receipt handling
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          brew install-bundler-gems --add-groups=ast
          python3 -m unittest discover -s .github/scripts -p '*_test.py'

  # Each formula is bottled on the runner of its tag in .github/scripts/bottle_tags.json.
  formulae:
    if: contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event_name)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            bottle-tag: arm64_tahoe
          - runner: macos-15
            bottle-tag: arm64_sequoia
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Detect the formulae to test
        id: detect
        env:
          FORMULA: ${{ inputs.formula }}
        run: brew test-bot --only-formulae-detect ${FORMULA:+"$FORMULA"}

      - name: Select the formulae bottled on this runner
        id: select
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          TESTING: ${{ steps.detect.outputs.testing_formulae }}
          ADDED: ${{ steps.detect.outputs.added_formulae }}
          BOTTLE_TAG: ${{ matrix.bottle-tag }}
        run: |
          jq -nr --arg testing "$TESTING" --arg added "$ADDED" --arg tag "$BOTTLE_TAG" \
            --slurpfile tags .github/scripts/bottle_tags.json '
            def formulae: split(",") | map(select(. != "")
              | select(($tags[0][split("/") | last] // error("No bottle tag for \(.)")) == $tag)) | join(",");
            "testing_formulae=\($testing | formulae)", "added_formulae=\($added | formulae)"
          ' >> "$GITHUB_OUTPUT"

      - run: brew test-bot --only-formulae --testing-formulae="$TESTING" --added-formulae="$ADDED" --deleted-formulae="$DELETED"
        if: steps.select.outputs.testing_formulae != '' || steps.detect.outputs.deleted_formulae != ''
        env:
          TESTING: ${{ steps.select.outputs.testing_formulae }}
          ADDED: ${{ steps.select.outputs.added_formulae }}
          DELETED: ${{ steps.detect.outputs.deleted_formulae }}

      - name: Merge and audit candidate bottle metadata
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          bottles=( ./*.bottle.json )
          if (( ${#bottles[@]} == 0 )); then exit 0; fi
          brew bottle --merge --write --no-commit --no-all-checks "${bottles[@]}"
          while IFS= read -r formula; do
            brew audit --formula --skip-style "$TAP/$formula"
          done < <(jq -r '.[].formula.name' "${bottles[@]}" | sort -u)

      # Re-running only the failed jobs keeps the other runner's upload, so the name has no attempt.
      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bottles_${{ matrix.runner }}
          path: '*.bottle.*'
          overwrite: true

  # The required check. It runs after failed or cancelled jobs too, so a skipped needed job cannot pass it.
  test-bot:
    needs: [tap-syntax, formulae]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require the syntax checks and bottle builds
        env:
          TAP_SYNTAX: ${{ needs.tap-syntax.result }}
          FORMULAE: ${{ needs.formulae.result }}
          BUILDS: ${{ contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event_name) }}
        run: |
          [[ "$TAP_SYNTAX" == success ]]
          [[ "$FORMULAE" == success || ("$BUILDS" == false && "$FORMULAE" == skipped) ]]

      - uses: actions/download-artifact@v8.0.2
        if: contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event_name)
        with:
          pattern: bottles_*
          path: ${{ runner.temp }}/bottles
          merge-multiple: true
          digest-mismatch: error

      # publish.yml takes one artifact per build attempt.
      - name: Upload the build's bottles as one artifact
        if: contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event_name)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bottles-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bottles/*.bottle.*
