name: Bottle readiness

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: bottle-ready-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  bottle-ready:
    # A pull request gets its bottle commit only after test-bot passes on it, so the bottles are
    # verified on the commit the merge queue would land. GitHub counts the job skipped on the pull
    # request as passing, which leaves the queue, the only way to merge, to enforce it.
    if: github.event_name == 'merge_group'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1
        id: homebrew
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check source-bound bottle metadata
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          brew install-bundler-gems --add-groups=ast
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 'refs/tags/publish/*:refs/tags/publish/*'
          git diff --name-only --no-renames --diff-filter=d "$BASE_SHA" "$HEAD_SHA" |
            jq -R . | jq -s '[.[] | select(test("^Formula/[^/]+\\.rb$"))]' > "$RUNNER_TEMP/paths.json"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$HEAD_SHA" --slurpfile paths "$RUNNER_TEMP/paths.json" \
            '{repository: $repository, head_sha: $sha, paths: $paths[0]}' > "$RUNNER_TEMP/selection.json"
          brew ruby .github/scripts/bottle_receipt.rb check "$RUNNER_TEMP/selection.json" > "$RUNNER_TEMP/ready.json"

      - name: Fetch, pour and test the bottles
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          TAP: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          set -euo pipefail
          while IFS= read -r formula; do
            formula="$TAP/$formula"
            brew fetch --formula --bottle-tag=arm64_tahoe "$formula"
            brew install --formula --force-bottle "$formula"
            brew info --json=v2 --formula "$formula" | jq -e '.formulae[0].installed | length > 0 and all(.[]; .poured_from_bottle == true)'
            brew test "$formula"
          done < <(jq -r '.formulae[]' "$RUNNER_TEMP/ready.json")
